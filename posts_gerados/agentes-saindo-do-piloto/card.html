<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; }
  body {
    font-family: "Segoe UI", Inter, system-ui, Arial, sans-serif;
    background: radial-gradient(130% 130% at 0% 0%, #1a234d 0%, #0f1530 55%, #080b1c 100%);
    color: #f5f7fa;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 110px 96px;
  }
  .bar { width: 104px; height: 14px; border-radius: 8px; background: #405ABA; }
  .hook { font-size: 72px; line-height: 1.14; font-weight: 800; letter-spacing: -1px; max-width: 1010px; }
  .accent { color: #7B92EA; }
  .foot { display: flex; align-items: center; gap: 18px; font-size: 30px; color: #aab2dd; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #405ABA; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="hook">Os agentes de IA saíram da fase de demonstração. <span class="accent">Agora o trabalho de engenharia muda de lugar.</span></div>
  <div class="foot"><span class="dot"></span> Paulo Eduardo · Engenharia de Software</div>
</body>
</html>
