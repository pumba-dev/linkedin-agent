<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Slide conceitual (1200x1200) estilo PowerPoint: simples, poucas cores, baixo contraste, sem gradiente. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; }
  body {
    font-family: "Segoe UI", Inter, system-ui, Arial, sans-serif;
    background: #F5F6F9;
    color: #3C4453;
  }
  .slide { width: 1200px; height: 1200px; padding: 104px 96px; display: flex; flex-direction: column; }
  .title { font-size: 54px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15; color: #2F3542; }
  .title .accent { color: #5566A6; }
  .subtitle { margin-top: 14px; font-size: 27px; font-weight: 500; color: #7A8195; }
  .diagram { flex: 1; display: flex; align-items: center; justify-content: center; }
  .harness {
    position: relative; width: 100%;
    background: #E9ECF6; border: 2px solid #B9C2DE; border-radius: 30px;
    padding: 104px 64px 68px;
    display: flex; flex-direction: column; align-items: center; gap: 42px;
  }
  .harness-label {
    position: absolute; top: 30px; left: 44px;
    font-size: 25px; font-weight: 700; letter-spacing: 3px; color: #5566A6;
  }
  .model {
    background: #FFFFFF; border: 2px solid #C3CADF; border-radius: 22px;
    padding: 38px 60px; text-align: center;
    display: flex; flex-direction: column; gap: 10px;
  }
  .model b { font-size: 46px; font-weight: 700; color: #2F3542; }
  .model small { font-size: 25px; font-weight: 500; color: #7A8195; }
  .tools { display: flex; gap: 22px; }
  .chip {
    background: #FFFFFF; border: 1.5px solid #C3CADF; border-radius: 999px;
    padding: 16px 32px; font-size: 28px; color: #4A5163; font-weight: 600;
  }
  .loop { font-size: 31px; font-weight: 600; color: #5566A6; letter-spacing: 0.5px; }
  .punch { margin-top: 6px; font-size: 42px; font-weight: 700; color: #2F3542; }
  .foot { margin-top: 34px; font-size: 24px; color: #9AA0AE; font-weight: 600; display: flex; align-items: center; gap: 14px; }
  .foot .dot { width: 10px; height: 10px; border-radius: 50%; background: #5566A6; display: inline-block; }
</style>
</head>
<body>
  <div class="slide">
    <div>
      <div class="title">O que é o <span class="accent">harness</span></div>
      <div class="subtitle">a camada que faz o modelo agir, não só responder</div>
    </div>
    <div class="diagram">
      <div class="harness">
        <span class="harness-label">HARNESS</span>
        <div class="model">
          <b>Modelo</b>
          <small>raciocina, mas não vê nem executa</small>
        </div>
        <div class="tools">
          <span class="chip">ler arquivo</span>
          <span class="chip">editar</span>
          <span class="chip">rodar comando</span>
        </div>
        <div class="loop">tenta &rarr; observa &rarr; corrige</div>
      </div>
    </div>
    <div class="punch">Modelo é o motor. Harness é o carro inteiro.</div>
    <div class="foot"><span class="dot"></span> Paulo Araujo · Engenharia de Software</div>
  </div>
</body>
</html>
